<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sound Test</title>
<style>
:root{--night:#0b130e;--panel:#17271d;--rule:#3a5242;--chalk:#f1eee4;--dim:#a7b4a9;--flood:#ffcf3d;--ink:#1c1500;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--night);color:var(--chalk);font:16px/1.4 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;touch-action:manipulation;-webkit-text-size-adjust:100%}
main{padding:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-right,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 24px) calc(env(safe-area-inset-left,0px) + 16px);max-width:900px;margin:auto}
h1{font-size:24px;margin:0 0 4px}
p{margin:0 0 12px;color:var(--dim)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.sound{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:8px}
.sound h3{font-size:16px;margin:0 0 8px}
.pair{display:flex;gap:8px}
.pair button{flex:1;min-width:0}
.sound small{display:block;color:var(--dim);font-size:13px;margin-top:6px;overflow-wrap:anywhere}
button{font:inherit;font-weight:700;color:var(--chalk);background:var(--panel);border:1px solid var(--rule);border-radius:10px;min-height:48px;padding:8px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.grid button{min-height:64px}
button:active{background:var(--rule)}
button.on{background:var(--flood);border-color:var(--flood);color:var(--ink)}
.wide{grid-column:1/-1}
h2{font-size:18px;margin:20px 0 8px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:4px 8px;border-bottom:1px solid var(--rule);text-align:right;white-space:nowrap}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
</style>
</head>
<body>
<main>
  <h1>Sound Test</h1>
  <p>Tap a button to hear it. On an iPhone, the silent switch on the side turns all of this off.</p>
  <p id="status">Recordings In: 0</p>
  <div class="list" id="sounds"></div>
  <h2>Together</h2>
  <div class="grid">
    <button class="act" id="bed">Crowd Bed</button>
    <button class="act" id="bedsynth">Crowd Bed Synth</button>
    <button class="act" id="try">Try Scored</button>
    <button class="act" id="busy">All at Once</button>
    <button class="act" id="soft">Small Bounce</button>
  </div>
  <h2>Levels</h2>
  <p>The same sounds drawn silently and measured, each recording beside its synth. Clipped should always be 0.</p>
  <div class="grid"><button class="act wide" id="measure">Measure</button></div>
  <div class="scroll"><table id="table" hidden></table></div>
</main>

<script>
var bedOn = false, bedSynth = false;
var $ = function (id) { return document.getElementById(id); };
var mk = function (tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; };
Object.keys(SOUND_NAMES).forEach(function (k) {
  var files = SOUND_FILES[k] || [], card = mk('div', 'sound'), pair = mk('div', 'pair');
  card.appendChild(mk('h3', '', SOUND_NAMES[k]));
  /* act: a button with its own sound, so no menu tap over it */
  if (files.length) { var rec = mk('button', 'act', 'Recording'); rec.dataset.key = k; rec.addEventListener('click', function () { sfx(k); }); pair.appendChild(rec); }
  var syn = mk('button', 'act', 'Synth'); syn.dataset.key = k; syn.dataset.synth = '1'; syn.addEventListener('click', function () { sfx(k, null, true); }); pair.appendChild(syn);
  card.appendChild(pair);
  files.forEach(function (f, i) { card.appendChild(mk('small', '', 'Take ' + (i + 1) + ': ' + (CREDITS[f[0]] || f[0]))); });
  if (!files.length) card.appendChild(mk('small', '', 'Synth Only'));
  $('sounds').appendChild(card);
});
var bedButtons = function () { $('bed').classList.toggle('on', bedOn && !bedSynth); $('bedsynth').classList.toggle('on', bedOn && bedSynth); };
$('bed').addEventListener('click', function () { bedOn = !(bedOn && !bedSynth); bedSynth = false; bedButtons(); ac(); bedSync(bedOn); });
$('bedsynth').addEventListener('click', function () { bedOn = !(bedOn && bedSynth); bedSynth = true; bedButtons(); ac(); bedSync(bedOn, true); });
$('try').addEventListener('click', function () { sfx('whistle'); sfx('roar'); });
$('busy').addEventListener('click', function () { Object.keys(SOUND_NAMES).forEach(function (k) { if (k !== 'tap') sfx(k); }); });
$('soft').addEventListener('click', function () { sfx('bounce', 0.3); });
var total = Object.keys(SOUND_FILES).reduce(function (n, k) { return n + SOUND_FILES[k].length; }, 0);
setInterval(function () { soundFrame(bedOn, bedSynth); $('status').textContent = 'Recordings In: ' + Object.keys(SAMPLE.bufs).length + ' of ' + total; }, 250);      /* the game does this every frame */
$('measure').addEventListener('click', function () {
  var keys = Object.keys(SOUND_NAMES), rows = [];
  keys.concat(['bed']).forEach(function (k) {
    var name = SOUND_NAMES[k] || 'Crowd Bed';
    if (k === 'bed' ? soundTakes('bed').length : soundTakes(k).length) rows.push([name, 'Recording', k, false]);
    rows.push([name, 'Synth', k, true]);
  });
  rows.push(['All at Once', '', keys, false]);
  var t = $('table'); t.hidden = false; t.innerHTML = '<tr><th>Sound</th><th>Version</th><th>Peak dB</th><th>RMS dB</th><th>Seconds</th><th>Clipped</th></tr>';
  rows.reduce(function (p, r) {
    return p.then(function () { return soundRender(r[2], { secs:r[2] === 'bed' ? 8 : 4, synth:r[3] }); }).then(function (m) {
      var tr = document.createElement('tr');
      [r[0], r[1], m.peakDb.toFixed(1), m.rmsDb.toFixed(1), m.length.toFixed(2), m.clipped].forEach(function (v) { var c = document.createElement('td'); c.textContent = v; tr.appendChild(c); });
      t.appendChild(tr);
    });
  }, Promise.resolve());
});
</script>

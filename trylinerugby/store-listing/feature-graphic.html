<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1024">
<title>Feature Graphic · Try Line Rugby</title>
<!-- Google Play's feature graphic, 1024x500: node tools/listing-shots.mjs renders this page to screenshots/play-feature-graphic.png
     with the lineout close-up (scorebug, hints and buttons hidden) set as .bg. The wordmark is the home screen's. -->
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  :root{--night:#0b130e;--chalk:#f1eee4;--chalk-dim:#a7b4a9;--flood:#ffcf3d;
    --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;--body:'Atkinson Hyperlegible',system-ui,sans-serif}
  html,body{margin:0;width:1024px;height:500px;overflow:hidden;background:var(--night);color:var(--chalk)}
  .bg{position:absolute;inset:0;background:#1d4a2a 72% 50%/auto 116% no-repeat}   /* a little in, past the close-up's letterbox bars */
  .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,19,14,.96) 0%,rgba(11,19,14,.9) 34%,rgba(11,19,14,.25) 60%,rgba(11,19,14,0) 80%)}
  .mark{position:absolute;left:76px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:22px}
  .word{margin:0;display:flex;flex-direction:column;font:900 168px/.78 var(--display);text-transform:uppercase;letter-spacing:-.005em}
  .word .try{color:transparent;-webkit-text-stroke:2.5px var(--chalk)}
  .word .line{position:relative;padding-bottom:18px;width:max-content}
  .word .line::after{content:"";position:absolute;left:-4px;right:-44px;bottom:0;height:9px;background:var(--chalk);box-shadow:0 0 22px rgba(241,238,228,.28)}
  .posts{position:absolute;right:-44px;bottom:0;width:32px;height:70px;border-left:5px solid var(--chalk);border-right:5px solid var(--chalk)}
  .posts::after{content:"";position:absolute;left:0;right:0;top:46%;height:5px;background:var(--chalk)}
  .eyebrow{margin:0;font:700 22px/1.2 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--flood)}
</style>
</head>
<body>
<div class="bg"></div>
<div class="shade"></div>
<header class="mark">
  <h1 class="word" aria-label="Try Line"><span class="try">Try</span><span class="line">Line<span class="posts"></span></span></h1>
  <p class="eyebrow">Rugby Sevens</p>
</header>
</body>
</html>

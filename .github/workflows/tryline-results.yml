# Try Line Rugby: the weekly real results (trylinerugby/README.md, Real results: the weekly job). Rebuilds trylinerugby/results.json from
# public results pages and opens a pull request for the owner to merge. It never pushes to main: it pushes only its own results/<week>
# branch. The pull request step needs the repository setting "Allow GitHub Actions to create and approve pull requests" (Settings, Actions,
# General). A schedule runs only from the default branch.
name: Try Line results
on:
  schedule:
    - cron: '17 22 * * 0'   # Sunday 22:17 UTC: Saturday's results and most of Sunday's are in
    - cron: '43 8 * * 1'    # Monday 08:43 UTC: late results, corrections and Monday's world rankings; the backstop for a missed Sunday
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: tryline-results
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: trylinerugby
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gather the week's results (writes nothing unless every check passes)
        run: node tools/results/update.mjs --cache "$RUNNER_TEMP/results-cache" --summary "$RUNNER_TEMP/summary.md"
      - name: Open or update the week's pull request, if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add results.json tools/results/last-tables.json
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          u=$(TZ=Europe/London date +%u)
          week=$(TZ=Europe/London date -d "$(( u % 7 - 1 )) days ago" +%F)
          branch="results/$week"
          case "$branch" in results/20[0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;; *) echo "Refusing branch $branch"; exit 1 ;; esac
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "Try Line results: week of $week"
          git push --force origin "HEAD:refs/heads/$branch"
          title="Try Line results: week of $week"
          { echo "The weekly results job's file for the week of $week. Merge it to publish; close it to skip the week."; echo; cat "$RUNNER_TEMP/summary.md"; } > "$RUNNER_TEMP/body.md"
          number=$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101418">
<title>Gordon's Games</title>
<style>
:root{--bg:#101418;--card:#1a2027;--line:#2c353f;--ink:#f3f1ea;--dim:#9aa5ae;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
main{width:min(440px,100%);display:flex;flex-direction:column;gap:14px}
h1{margin:0 0 6px;font-size:30px;letter-spacing:.01em}
a{display:flex;align-items:center;justify-content:space-between;min-height:64px;padding:0 20px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);text-decoration:none;font-weight:700;font-size:19px}
a:hover,a:focus-visible{border-color:var(--ink);outline:none}
a span{font-weight:400;font-size:14px;color:var(--dim)}
</style>
</head>
<body>
<main>
  <h1>Games</h1>
  <a href="trylinerugby/">Try Line Rugby <span>Rugby Sevens</span></a>
  <a href="farnhamfighters/">Farnham Fighters <span>Fighting</span></a>
  <a href="weddingcrashers/">The Wedding Crashers <span>Race to the Cake</span></a>
</main>
</body>
</html>
